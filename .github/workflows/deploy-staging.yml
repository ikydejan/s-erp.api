name: Deploy to Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - bin: api
            image: s-erp-api
          - bin: worker
            image: s-erp-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BIN_NAME=${{ matrix.bin }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bin }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy staging compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || 22 }}
          source: "docker-compose.staging.yml"
          target: ${{ secrets.STAGING_DEPLOY_PATH }}

      - name: Pull images & restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_API: ghcr.io/${{ github.repository_owner }}/s-erp-api:staging-${{ github.sha }}
          IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/s-erp-worker:staging-${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || 22 }}
          envs: IMAGE_API,IMAGE_WORKER,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d
            docker image prune -f
