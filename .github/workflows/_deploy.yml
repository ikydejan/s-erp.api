name: Build & Publish (reusable)

# Pull-based delivery: this workflow only builds the api/worker images and
# pushes them to GHCR with the environment's tag. It does NOT touch the
# server — Watchtower running on each server polls GHCR and updates the
# running containers itself. See docker-compose.deploy.yml and README.md
# ("Deploy") for the server-side setup.
#
# The `environment` input still gates `production`: if that GitHub
# Environment has required reviewers configured, the push step pauses for
# approval before an image ever gets published under the `production` tag,
# which is the only checkpoint before Watchtower picks it up.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - bin: api
            image: s-erp-api
          - bin: worker
            image: s-erp-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BIN_NAME=${{ matrix.bin }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.environment }}-${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}-${{ matrix.bin }}
