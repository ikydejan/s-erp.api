name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - bin: api
            image: s-erp-api
          - bin: worker
            image: s-erp-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BIN_NAME=${{ matrix.bin }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.environment }}-${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}-${{ matrix.bin }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: "docker-compose.deploy.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull images & restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_API: ghcr.io/${{ github.repository_owner }}/s-erp-api:${{ inputs.image_tag }}-${{ github.sha }}
          IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/s-erp-worker:${{ inputs.image_tag }}-${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          envs: IMAGE_API,IMAGE_WORKER,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            docker image prune -f
