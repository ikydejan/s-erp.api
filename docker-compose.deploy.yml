# Deployed by .github/workflows/_deploy.yml (reusable), called from both
# deploy-sandbox.yml (environment: sandbox) and deploy-production.yml
# (environment: production). Images are pulled from GHCR, not built here.
# A `.env` file with real secrets for that environment must already exist
# next to this file on the server (see README.md "Deploy") — it is never
# created or copied by CI.
#
# Postgres is NOT run as a container here: both environments use a Postgres
# that already runs directly on the host OS. `api`/`worker` reach it via
# `host.docker.internal` (mapped below with extra_hosts), so set
# DATABASE_URL in .env to something like
# postgres://user:pass@host.docker.internal:5432/dbname.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - erp_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_API}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      opensearch:
        condition: service_healthy

  worker:
    image: ${IMAGE_WORKER}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  erp_opensearch_data:
